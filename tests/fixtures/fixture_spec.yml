# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 1313
tables:
  - name: members
    rows: 1000
    pk: member_id
    cast: {date_of_birth: date}
    columns:
      member_id: {type: id, prefix: MB}
      plan: {type: choice, values: [bronze, silver, gold], p: [0.5, 0.35, 0.15]}
      date_of_birth: {type: date, start: 1950-01-01, end: 2005-12-31}
  - name: providers
    rows: 80
    pk: provider_id
    columns:
      provider_id: {type: id, prefix: PR}
      specialty: {type: choice, values: [general_practice, cardiology, orthopaedics, maternity, radiology]}
  - name: preauth_requests
    rows: 4000
    pk: request_id
    fk: {member_id: members.member_id, provider_id: providers.provider_id}
    columns:
      request_id: {type: id, prefix: PA}
      member_id: {type: fk, table: members, column: member_id}
      provider_id: {type: fk, table: providers, column: provider_id}
      requested_at: {type: timestamp, start: 2025-01-01, end: 2025-06-30}
      decision: {type: choice, values: [approved, denied, pending], p: [0.75, 0.15, 0.10]}
      decided_at: {type: expr, expr: "(df.requested_at + pd.to_timedelta(rng.lognormal(2.5, 0.8, n), unit='h')).where(df.decision != 'pending')"}
      requested_amount_usd: {type: float, dist: lognormal, mean: 6.0, sigma: 0.9}
  - name: claims
    rows: 6000
    pk: claim_id
    fk: {member_id: members.member_id, provider_id: providers.provider_id}
    cast: {service_date: date}
    columns:
      claim_id: {type: id, prefix: CL}
      member_id: {type: fk, table: members, column: member_id}
      provider_id: {type: fk, table: providers, column: provider_id}
      service_date: {type: date, start: 2025-01-01, end: 2025-06-30}
      paid_amount_usd: {type: float, dist: lognormal, mean: 5.5, sigma: 1.0}
