version: 2
models:
  - name: stg_synpuf__beneficiary_years
    data_tests:
      - trust_tests.unique_combination:
          arguments:
            columns: [member_key, file_year]
    columns:
      - name: member_key
        data_tests: [not_null]
  - name: stg_synpuf__claim_lines
    columns:
      - name: claim_line_id
        data_tests: [unique, not_null]
      - name: setting
        data_tests:
          - accepted_values:
              arguments:
                values: [inpatient, outpatient]
  - name: stg_preauth__events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: [submitted, info_requested, info_received, approved, denied, withdrawn]
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: [urgent, standard]
